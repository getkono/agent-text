[package]
name = "agent-text"
version = "0.1.1"
description = "Generate text through local AI agent CLIs"
readme = "README.md"
keywords = ["ai", "agent", "claude", "codex", "text-generation"]
categories = ["api-bindings", "development-tools"]
edition = "2024"
rust-version = "1.85"
authors = ["Justin Chung <noreply@justinchung.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkono/agent-text"
homepage = "https://github.com/getkono/agent-text"

[features]
default = ["claude-code", "codex"]
claude-code = ["dep:serde", "dep:tempfile", "dep:tokio"]
codex = ["dep:semver", "dep:serde", "dep:tempfile", "dep:tokio"]

[dependencies]
async-trait = "0.1"
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "claude"
required-features = ["claude-code"]

[[example]]
name = "codex"
required-features = ["codex"]
